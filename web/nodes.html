<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nœuds &amp; transformations</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Nœuds &amp; transformations</h1>
      <a class="file-button" href="index.html">← Voir le graphe</a>
      <a class="file-button" href="path.html">Recherche de chemin</a>
      <span class="file-name" id="nodes-total"></span>
    </header>

    <main class="nodes-main">
      <div class="nodes-toolbar">
        <label class="field" style="flex: 1; max-width: 320px">
          Rechercher un nœud
          <input type="text" id="nodes-search-input" placeholder="ex: N123" autocomplete="off" />
        </label>
        <button id="nodes-search-btn" class="btn btn-primary" type="button" style="max-width: 160px">Rechercher</button>
        <button id="nodes-search-clear" class="btn btn-ghost" type="button" style="max-width: 120px">Effacer</button>
      </div>

      <p class="panel-hint" id="nodes-status">Chargement…</p>

      <div class="nodes-table-wrap" id="nodes-table-wrap">
        <table class="nodes-table">
          <thead>
            <tr>
              <th>Nœud</th>
              <th>Transformations liées</th>
            </tr>
          </thead>
          <tbody id="nodes-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="nodes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de projet</title>
<link rel="stylesheet" href="kanban.css">
</head>
<body>

<header>
  <h1 id="projectTitle" title="Cliquer pour renommer">Mon projet</h1>
  <div class="toolbar">
    <select id="projectFilter" title="Filtrer par projet"></select>
    <button id="addProjectBtn" title="Créer un nouveau projet">+ Projet</button>
    <button id="notesBtn" title="Comptes rendus des points projet du projet affiché">📝 Points projet</button>
    <input type="search" id="search" placeholder="Rechercher une tâche…">
    <button class="primary" id="addBtn">+ Nouvelle tâche</button>
    <button id="exportBtn">Exporter JSON</button>
    <button id="importBtn">Importer JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button id="exportXlsxBtn" title="Exporte les tâches du projet affiché">Exporter Excel</button>
    <button id="importXlsxBtn" title="Fichier .xlsx ou .csv (1re ligne = titres des colonnes)">Importer Excel</button>
    <input type="file" id="importXlsxFile" accept=".xlsx,.csv" hidden>
  </div>
</header>

<div class="progress">
  <div class="bar"><div id="progressBar"></div></div>
  <span id="progressText">0 %</span>
</div>

<main class="board" id="board"></main>

<!-- Fenêtre de création / modification d'une tâche -->
<dialog id="taskDialog">
  <form method="dialog" id="taskForm">
    <h2 id="dialogTitle" style="margin:0;font-size:16px">Nouvelle tâche</h2>
    <label>Titre <input type="text" name="title" required></label>
    <label>Projet <input type="text" name="project" list="projectList" placeholder="ex. Restitution graphe"></label>
    <datalist id="projectList"></datalist>
    <label>Description <textarea name="description" rows="3"></textarea></label>
    <div class="row">
      <label>Priorité
        <select name="priority">
          <option value="basse">Basse</option>
          <option value="moyenne" selected>Moyenne</option>
          <option value="haute">Haute</option>
        </select>
      </label>
      <label>Étiquette <input type="text" name="label" placeholder="ex. SQL, front…"></label>
    </div>
    <div class="row">
      <label>Échéance <input type="date" name="due"></label>
      <label>Colonne
        <select name="column" id="columnSelect"></select>
      </label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="danger" id="deleteBtn">Supprimer</button>
      <button type="button" id="cancelBtn">Annuler</button>
      <button type="submit" class="primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- Liste des points projet (comptes rendus de réunion) du projet affiché -->
<dialog id="notesDialog" class="wide">
  <div class="notes-head">
    <h2 id="notesTitle">Points projet</h2>
    <button type="button" class="primary" id="addNoteBtn">+ Nouveau point</button>
    <button type="button" id="closeNotesBtn">Fermer</button>
  </div>
  <div id="notesList"></div>
</dialog>

<!-- Fenêtre de création / modification d'un point projet -->
<dialog id="noteDialog" class="wide">
  <form method="dialog" id="noteForm">
    <h2 id="noteDialogTitle" style="margin:0;font-size:16px">Nouveau point projet</h2>
    <div class="row">
      <label>Date <input type="date" name="date" required></label>
      <label>Projet <input type="text" name="project" list="projectList"></label>
    </div>
    <label>Titre <input type="text" name="title" placeholder="ex. Point hebdo, Comité de pilotage…"></label>
    <label>Participants <input type="text" name="participants" placeholder="ex. équipe projet, client"></label>
    <label>Compte rendu <textarea name="content" rows="14"></textarea></label>
    <div class="dlg-actions">
      <button type="button" class="danger" id="deleteNoteBtn">Supprimer</button>
      <button type="button" id="cancelNoteBtn">Annuler</button>
      <button type="submit" class="primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script src="kanban-excel.js"></script>
<script src="kanban.js"></script>
</body>
</html>
